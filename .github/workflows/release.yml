name: Release

# Pushing tag `1.2.3` publishes @toters/toterslokalise-mcp@1.2.3 to npmjs.com.
# Needs the repository secret NPM_TOKEN (npm automation token with publish
# rights on the @toters scope).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      # Build before publish so npm sees dist/ (and keeps the `bin` entry).
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
